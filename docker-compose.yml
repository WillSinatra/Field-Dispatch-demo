# Base PostgreSQL solo para la demo (datos ficticios). Puerto 5433 para no pisar un Postgres local.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: field_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo   # credencial de juguete, solo para desarrollo local
    ports:
      - "5433:5432"
    volumes:
      - ./examples/atomic-claim/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./examples/atomic-claim/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
